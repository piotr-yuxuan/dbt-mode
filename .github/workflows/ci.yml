#
# The test suite, offline, on every branch.  It holds no rule: the checks are in the
# Makefile, and docs/reference/release-pipeline.md describes this file.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Before 1.0.0 only a branch's tip must pass.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # A branch of the repository is checked at its push. A pull request is checked only
    # when it comes from a fork, so that no branch is checked twice.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork
    name: ${{ matrix.part }}
    runs-on: ${{ matrix.os || 'ubuntu-24.04' }}
    # A beginning on macOS, which what follows on Linux does not wait for: see the reference.
    continue-on-error: ${{ matrix.part == 'macos' }}
    # One job per part, side by side; all but macos must pass before CD goes on.
    strategy:
      fail-fast: false
      matrix:
        include:
          - {part: static}
          - {part: test}
          - {part: macos, os: macos-15}
    # Measured here: make check in 1 minute, nothing to fetch. Several times that on a
    # runner, and the shell's fetch and the build of what cache.nixos.org lacks.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request's own commit: GitHub's merge of it has a title no check accepts.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # The whole history: the check of the commits reads it back to main.
          fetch-depth: 0
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
      - if: matrix.part == 'static'
        run: nix develop -c make check-static
      - if: matrix.part == 'static' && github.ref != 'refs/heads/main'
        run: nix develop -c make commits BASE=origin/main
      # No dbt is fetched: the live tests skip for the one reason that make test allows.
      - if: matrix.part != 'static'
        run: nix develop -c make test
